services:
  - type: web
    name: campuseats-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: FrontendOrigin
        sync: false
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: CampusEats
      - key: Jwt__Audience
        value: CampusEatsUsers
